name: Build and publish R package to Anaconda.org

on:
  push:
    tags:
      - "v*"

jobs:
  conda_deployment:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Conda environment creation and activation
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.11"
          environment-file: conda/environment.yaml
          auto-update-conda: false
          auto-activate-base: false
          show-channel-urls: true
      - name: Build and upload the conda packages
        uses: uibcdf/action-build-and-upload-conda-packages@v2.3.0
        with:
          meta_yaml_dir: conda/r-omicflow
          user: agusinac
          token: ${{ secrets.ANACONDA_TOKEN }}
          label: main
          upload: true