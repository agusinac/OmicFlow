{% set version = GIT_DESCRIBE_TAG.replace("v", "") %}
{% set posix = 'm2-' if win else '' %}
{% set native = 'm2w64-' if win else '' %}

package:
  name: r-omicflow
  version: {{ version }}

source:
  url: 
    - {{ cran_mirror }}/src/contrib/OmicFlow_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/OmicFlow/OmicFlow_{{ version }}.tar.gz

build:
  merge_build_host: True  # [win]
  # If this is a new build for the same version, increment the build number.
  number: 0
  # no skip
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - {{ posix }}filesystem            # [win]
    - {{ posix }}make
    - {{ posix }}sed                   # [win]
    - {{ posix }}coreutils             # [win]
    - {{ posix }}zip                   # [win]
  host:
    - r-base >=4.3,<4.4.0a0
    - r-ape
    - r-cli
    - r-data.table
    - r-matrix
    - r-matrixstats
    - r-matrixtests
    - r-ggplot2
    - r-ggrepel
    - r-jsonvalidate
    - r-lifecycle
    - r-patchwork
    - r-r6
    - r-rcolorbrewer
    - r-rcpp
    - r-rcppparallel
    - r-rcpparmadillo
    - bioconductor-rhdf5lib =1.24.0
    - bioconductor-rhdf5 =2.46.1
    - r-vegan
    - r-yyjsonr =0.1.20
  run:
    - r-base >=4.3,<4.4.0a0
    - {{native}}gcc-libs              # [win]
    - r-ape
    - r-cli
    - r-data.table
    - r-matrix
    - r-matrixstats
    - r-matrixtests
    - r-ggplot2
    - r-ggrepel
    - r-jsonvalidate
    - r-lifecycle
    - r-patchwork
    - r-r6
    - r-rcolorbrewer
    - r-rcpp
    - r-rcppparallel
    - r-rcpparmadillo
    - bioconductor-rhdf5lib =1.24.0
    - bioconductor-rhdf5 =2.46.1
    - r-vegan
    - r-yyjsonr =0.1.20

test:
  commands:
    - $R -e "library('OmicFlow')"           # [not win]
    - "\"%R%\" -e \"library('OmicFlow')\""  # [win]

about:
  home: https://agusinac.github.io/OmicFlow
  summary: Fast and Efficient (Automated) Analysis of Sparse Omics Data
  description: "
    A generalised data structure for fast and efficient loading and data munching of sparse omics data. The 'OmicFlow' requires an up-front validated metadata template from the user,
    which serves as a guide to connect all the pieces together by aligning them into a single object that is defined as an 'omics' class. 
    Once this unified structure is established, users can perform manual subsetting, visualisation, and statistical analysis, or leverage the automated 'autoFlow' method to generate a comprehensive report.
    "
  license: "MIT"
  license_family: MIT
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/MIT'
    - LICENSE

extra:
  recipe-maintainers:
    - agusinac
